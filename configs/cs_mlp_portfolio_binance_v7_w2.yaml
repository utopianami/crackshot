model:
  name: cs_mlp_portfolio

data:
  data_path: "BRAIN/binance/data/npy_phase2_w2/"
  sample_ratio: 1.0

dataset:
  horizon_indices: [0, 1, 2]
  primary_horizon: 1
  vol_idx: 4
  class_bins: [-0.01, -0.003, 0.003, 0.01]

cs_mlp_portfolio:
  hidden_units: [256, 128]
  dropout: 0.1
  use_layernorm: true
  activation: gelu
  feature_mode: zscore

  k_long: 10
  k_short: 10
  eps_start: 1.0
  eps_end: 0.05
  eps_warmup_epochs: 10
  sinkhorn_iter: 100

  lambda_beta: 0.01
  lambda_turn: 0.5
  lambda_vol: 0.0
  turnover_threshold: 7.0
  fee_per_side: 0.0005

  lr: 0.001
  weight_decay: 0.0
  epochs: 30
  patience: 8
  max_stocks: 320
  n_timestamps_per_batch: 8
  warmup_epochs: 3

  target_idx: 1
  beta_idx: 3
  vol_idx: 4
