model:
  name: cs_mlp

data:
  data_path: "data/binance/npy_phase1/"
  sample_ratio: 1.0

dataset:
  horizon_indices: [0, 1, 2]
  primary_horizon: 1
  vol_idx: 3
  class_bins: [-0.02, -0.005, 0.005, 0.02]

cs_mlp:
  hidden_units: [256, 128]
  pnl_weight: 2.0
  dropout: 0.3
  label_smoothing: 0.10
  feature_mode: raw_mean_zscore
