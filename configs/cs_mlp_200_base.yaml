model:
  name: cs_mlp

data:
  data_path: "data/kospi/260401_200_base/"
  sample_ratio: 0.05

dataset:
  horizon_indices: [4, 5, 6]   # c2c_60, c2c_120, c2c_240 in 7-label NPY
  primary_horizon: 1            # c2c_120
  vol_idx: -1
  class_bins: [-0.01, -0.003, 0.003, 0.01]

cs_mlp:
  hidden_units: [256, 128]
  pnl_weight: 2.0
  dropout: 0.4
  label_smoothing: 0.15
  feature_mode: raw_mean_zscore
