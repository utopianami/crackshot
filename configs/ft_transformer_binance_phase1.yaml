model:
  name: ft_transformer

data:
  data_path: "BRAIN/binance/data/npy_phase1/"
  sample_ratio: 1.0

dataset:
  horizon_indices: [0, 1, 2]   # fwd_1h, fwd_4h, fwd_24h
  primary_horizon: 1            # fwd_4h
  vol_idx: 3                    # vol_dummy (always 1)
  class_bins: [-0.02, -0.005, 0.005, 0.02]

ft_transformer:
  n_bins: 64
  d_token: 128
  n_heads: 4
  n_layers: 3
  label_smoothing: 0.05
  lr: 1e-4
  lr_schedule: cosine
  weight_decay: 1e-5
  patience: 10
  pnl_weight: 2.0
