[project]
name = "crackshot"
version = "0.1.0"
description = "KOSPI and Binance cross-sectional modeling experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
    "equinox==0.13.4",
    "jax==0.9.0.1",
    "numpy==2.4.4",
    "omegaconf==2.3.0",
    "optax==0.2.7",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "scipy==1.17.0",
]

[project.optional-dependencies]
alpha-squad = [
    "ag2[openai]>=0.8,<0.11",
    "chromadb>=1,<2",
    "lightrag-hku==1.4.11",
    "ollama>=0.6,<1",
    "sentence-transformers>=3,<6",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
